name: JARVIS
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: NO

targets:
  JARVIS:
    type: application
    platform: macOS
    sources:
      - path: JARVIS
        includes:
          - "*.swift"
    info:
      path: JARVIS/Info.plist
    entitlements:
      path: JARVIS/JARVIS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.app
        PRODUCT_NAME: JARVIS
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        INFOPLIST_FILE: JARVIS/Info.plist
